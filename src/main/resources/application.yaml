#
spring:
  application:
    name: API_transit_station
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/api_transit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8089}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/oauth/callback/github}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback/google}
  token:
    access-token-expiry: ${OAUTH_ACCESS_TOKEN_EXPIRY:900}
    refresh-token-expiry: ${OAUTH_REFRESH_TOKEN_EXPIRY:604800}

security:
  jwt:
    secret: ${JWT_SECRET:ChangeThisJwtSecretBeforeProduction1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
