spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/api_transit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

security:
  data-encryption-key: ${DATA_ENCRYPTION_KEY}
  jwt:
    secret: ${JWT_SECRET}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

gateway:
  allow-private-upstreams: ${ALLOW_PRIVATE_UPSTREAMS:false}
  trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}

vmcard:
  enabled: false
  allow-mutations: false
  allow-production-mutations: false

anyipay:
  enabled: false
  allow-money-mutations: false

features:
  shopgpt:
    enabled: false

creative:
  seedance:
    enabled: false
