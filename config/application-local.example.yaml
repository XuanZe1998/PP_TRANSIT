# 后端统一私有配置模板。复制为 application-local.yaml 后直接修改。
# application-local.yaml 已被 Git 忽略，环境变量仍可覆盖这里的同名配置。

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/api_transit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 2s
  flyway:
    enabled: true
  mail:
    host: "smtp.example.com"
    port: 587
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8089

app:
  seed-demo-catalog: false

security:
  # Base64 编码的 32 字节随机值；启用后不要随意更换。
  data-encryption-key: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  admin-session-expiry: 1800
  password:
    bcrypt-strength: 12
  login:
    max-failures: 5
    lock-seconds: 300
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173
  bootstrap-admin:
    username: admin
    password: "REPLACE_WITH_STRONG_PASSWORD"
  jwt:
    secret: "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
    expiration-ms: 86400000

gateway:
  max-request-content-bytes: 2097152
  allow-private-upstreams: false
  trust-forwarded-headers: false
  idempotency:
    enforce: true
    cleanup-ms: 3600000
  async:
    core-pool-size: 16
    max-pool-size: 128
    queue-capacity: 1000
    timeout-ms: 120000
  http:
    max-connections: 200
    pending-acquire-max-count: 500
    pending-acquire-timeout-ms: 10000
    connect-timeout-ms: 10000
    response-timeout-seconds: 90
    max-in-memory-bytes: 8388608
  rate-limit:
    default-token-rpm: 120
    distributed-enabled: true

# 好易智算（直接在本文件配置 Key，不要求环境变量）
haoee:
  enabled: false
  base-url: https://maas.haoee.com
  api-key: "REPLACE_WITH_ROTATED_HAOEE_API_KEY"
  verify-on-startup: false
  startup-verification-limit: 10

# NVIDIA：统一使用 nvidia；程序仍兼容旧私有文件里的 nvida 前缀。
nvidia:
  key: ""
  verify-on-startup: false
  startup-verification-limit: 10
  catalog-sync-cron: "0 17 */6 * * *"

model-catalog:
  verification-retry-cron: "0 37 3 * * *"

billing:
  currency: CNY
  amount-scale: 10000
  default-max-output-tokens: 4096
  reservation-expiry-seconds: 600
  reservation-cleanup-ms: 60000
  reservation-cleanup-initial-delay-ms: 60000
  max-admin-adjustment: 1000000000000

storage:
  other-service-images:
    directory: data/uploads/other-services
    max-bytes: 5242880

oauth:
  state-expiry: 600
  github:
    client-id: ""
    client-secret: ""
    redirect-uri: http://127.0.0.1:5173/oauth/callback/github
  google:
    client-id: ""
    client-secret: ""
    redirect-uri: http://127.0.0.1:5173/oauth/callback/google
  token:
    access-token-expiry: 900
    refresh-token-expiry: 604800

features:
  shopgpt:
    enabled: false

shopgpt:
  base-url: ""
  item-id: 0
  max-quantity: 10
  request-timeout-seconds: 20

vmcard:
  enabled: false
  environment: sandbox
  app-id: ""
  app-secret: ""
  public-key: ""
  private-key: ""
  webhook-secret: ""
  allow-mutations: false
  allow-production-mutations: false
  request-timeout-seconds: 30
  product-code-sync:
    enabled: false
    interval-ms: 60000
    initial-delay-ms: 5000

payment:
  mode: live
  enabled: false
  allow-money-mutations: false
  base-url: https://a.tjrl3.cn
  merchant-id: ""
  merchant-private-key: ""
  platform-public-key: ""
  notify-url: ""
  return-url: ""
  default-payment-type: alipay
  usd-cny-rate: 6.76693506
  request-timeout-seconds: 15
  timestamp-tolerance-seconds: 300
  local-test-mode: false
  documents:
    merchant:
      display-name: ""
      legal-name: ""
      address-line-1: ""
      address-line-2: ""
      country: ""
      contact-email: ""
      registration-id: ""
    time-zone: Asia/Shanghai
    font-path: ""

service-orders:
  reservation-minutes: 15
  expiry-scan-ms: 60000
  # Production: list only the card redemption domains you control or trust.
  redemption-allowed-hosts: "redeem.example.com"

account:
  # EMAIL_AND_PHONE is the secure default; EMAIL_ONLY supports email-only deployments.
  verification-mode: EMAIL_AND_PHONE

platform:
  public-base-url: "https://modelhub.example.com"

verification:
  # Use a separate random production secret. Verification codes are stored as HMAC digests only.
  hmac-secret: ""
  debug-code-enabled: false
  email:
    from: "no-reply@example.com"
  sms:
    # Supported values: tencent, aliyun. endpoint points to your secured adapter endpoint.
    provider: ""
    endpoint: ""
    token: ""
