server {
    # Cloudflare Tunnel currently forwards modelhub.qzz.io to localhost:5173.
    # Nginx takes over that port after the Vite development server is stopped.
    listen 127.0.0.1:5173;
    server_name modelhub.qzz.io localhost 127.0.0.1;

    root D:/Code/中转站/API_transit_station/web/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
