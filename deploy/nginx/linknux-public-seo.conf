# Inside the existing linknux.com HTTPS server only. Uses its existing root and headers.
location = /robots.txt {
    types { }
    default_type text/plain;
    try_files /robots.txt =404;
}
location = /sitemap.xml {
    types { }
    default_type application/xml;
    try_files /sitemap.xml =404;
}
location = /docs {
    try_files /docs/index.html =404;
}
location = /pricing {
    try_files /pricing/index.html =404;
}
location = /docs/ {
    return 301 /docs$is_args$args;
}
location = /pricing/ {
    return 301 /pricing$is_args$args;
}
