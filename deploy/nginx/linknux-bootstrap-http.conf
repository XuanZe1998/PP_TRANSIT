# HTTP bootstrap: ACME only until verified application artifacts are installed.
server {
    listen 80;
    listen [::]:80;
    server_name linknux.com api.linknux.com blog.linknux.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / { return 503; }
}
