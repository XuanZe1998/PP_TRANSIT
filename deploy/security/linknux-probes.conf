# Matches only high-confidence scanner paths that our Nginx config returns as 404.
# IP comes from Nginx's socket peer ($remote_addr), not a client-supplied header.
[Definition]
failregex = ^<HOST> - \S+ \[\] "(?:GET|POST|HEAD) /(?:\.(?:env(?:\.[^ /?]+)?|git(?:/[^ ?]*)?|aws(?:/[^ ?]*)?)|wp-login\.php|xmlrpc\.php|wp-admin(?:/[^ ?]*)?|phpmyadmin(?:/[^ ?]*)?|vendor/phpunit(?:/[^ ?]*)?)(?:\?[^ "\r\n]*)? HTTP/[0-9.]+" 404 \d+ .*$
ignoreregex =
