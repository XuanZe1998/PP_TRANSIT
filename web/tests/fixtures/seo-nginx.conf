events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        include /review/linknux-public-seo.conf;
        location / { try_files $uri $uri/ /app.html; }
    }
}
